[project]
name = "app"
version = "0.1.0"
description = "EPIC-Africa intercity bus booking API"
requires-python = ">=3.14,<4.0"
dependencies = [
    "fastapi[standard]>=0.141.1,<1.0.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.2.1,<3.0.0",
    "sqlalchemy>=2.0.40,<3.0.0",
    "alembic>=1.19.1,<2.0.0",
    "psycopg[binary]>=3.3.6,<4.0.0",
    "python-json-logger>=3.2.0,<5.0.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.3,<10.0.0",
    "mypy>=1.8.0,<3.0.0",
    "ruff>=0.16.0,<1.0.0",
    "coverage>=7.4.3,<8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
exclude = ["venv", ".venv", "alembic"]

[tool.ruff]
target-version = "py314"
exclude = ["alembic"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "S608",   # SQL built from strings
    "ARG001", # unused function arguments
    "T201",   # print statements
]
ignore = [
    "E501", # line length is the formatter's job
    "B008", # function calls in argument defaults (FastAPI Depends)
]

[tool.ruff.lint.per-file-ignores]
"app/cli.py" = ["T201"]

[tool.coverage.run]
source = ["app"]
dynamic_context = "test_function"

[tool.coverage.report]
show_missing = true
sort = "-Cover"

[tool.fastapi]
entrypoint = "app.main:app"
